name: ProspectFinder validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/nationwide-prospectfinder]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
