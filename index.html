<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary Meta ─────────────────────────────────── -->
    <title>HR On Demand - CRM</title>
    <meta name="description" content="HR On Demand SMB & Nonprofit Outreach Tracker.CRM for prospect management." />
    <meta name="author"      content="HR On Demand" />
    <meta name="robots"      content="noindex, nofollow" />

    <!-- ── Favicon (inline SVG data URI — no extra files needed) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>" />

    <!-- ── Open Graph (for sharing / Slack unfurls) ──────── -->
    <meta property="og:title"       content="HR On Demand CRM" />
    <meta property="og:description" content="HR On Demand — SMB & Nonprofit outreach tracker" />
    <meta property="og:type"        content="website" />

    <!-- ── PWA / Mobile ──────────────────────────────────── -->
    <meta name="theme-color" content="#0B1426" />
    <meta name="apple-mobile-web-app-capable"           content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style"  content="black-translucent" />
    <meta name="apple-mobile-web-app-title"             content="HR On Demand CRM" />

    <!-- ── Security headers (set these on your server too) ─ -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy"        content="strict-origin-when-cross-origin" />

    <!-- ── Global reset ──────────────────────────────────── -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0B1426;          /* matches CRM navyDark — no flash of white */
        color: #F0F4FF;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Prevent scrollbars flashing during initial load */
      body { overflow-x: hidden; }

      /* Native select arrow fix for dark backgrounds */
      select { color-scheme: dark; }

      /* Vite dev overlay tweak — keep it readable */
      vite-error-overlay { --color-backdrop: rgba(11,20,38,0.85); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite injects the module script here during build -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
